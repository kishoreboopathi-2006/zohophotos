<!DOCTYPE><html>
<head>
<link rel="stylesheet" href="signup.css">
<script src="signup.js" defer></script>
</head>
<body>
<div class="container">
	<!-- Visual Panel -->
	<div class="visual-panel">
		<a href="index.html" style="color: #888; font-size: 13px;">← Back
			to Home</a>


		<div class="hero-text">
			<h2>
				Capturing Moments,<br>Creating Memories
			</h2>

		</div>
	</div>


	<div class="form-panel">
		<h1>Create an account</h1>
		<p class="login-link">
			Already have an account? <a href="signin.html">signIn</a>
		</p>

		<form id="signupForm">
			<div class="form-grid"></div>

			<div class="form-group">
				<label>UserName</label> <input type="text" id="name"
					placeholder="Enter your name" name="name" required>
					
			</div>

			<div class="form-group">
				<label for="email">Email</label> <input type="email" placeholder="Email" id="email"
					name="email" required>
						<p id="msg1"></p>
			</div>

			<div class="form-group" style="position: relative;">
				<label>Password</label> <input type="password" id="password"
					placeholder="Enter your password" name="password" required>
						<p id="msg2"></p>
				
			</div>
			<button type="submit" class="submit-btn">Sign Up</button>
		</form>

	</div>
</div>

</body>
</html>
