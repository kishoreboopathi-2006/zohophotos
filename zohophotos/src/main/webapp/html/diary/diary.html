<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>My Diary</title>

<link rel="stylesheet"
	href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css">
<link rel="stylesheet" href="diary.css">
<script src="https://unpkg.com/@phosphor-icons/web"></script>

</head>

<body>


	<!-- ===== SIDEBAR ===== -->
	<aside class="sidebar">
		<div class="sidebar-logo">
			<img
					src="momento1.png"
					class="logo">
			
		</div>

		<nav>
			<div class="menu-item" onclick="dashboardPage()">
				<i class="ph ph-squares-four"></i> <span>Dashboard</span>
			</div>

			<div class="menu-item " onclick="albumPage()">
				<i class="ph ph-folder-notch"></i> <span>Albums</span>
			</div>

			<div class="menu-item" onclick="favouritePage()">
				<i class="ph ph-heart"></i> <span>Favorites</span>
			</div>

			<div class="menu-item active" onclick="diaryPage()">
				<i class="ph ph-notebook"></i> <span>Diary</span>
			</div>

			<!--  <div class="menu-item" onclick="reminderPage()">
				<i class="ph ph-hourglass-medium"></i> <span>Reminder</span>
			</div>-->


		</nav>
		<div class="menu-item bottom" onclick="trashPage()">
			<i class="ph ph-trash"></i> <span>Trash</span>
		</div>

		<!--  <a href="/zohophotos/html/loginpage/signin.html" class="menu-item"
			style="margin: 15px; color: var(--danger); text-decoration: none;">
			<i class="ph ph-sign-out"></i> <span>Sign Out</span>
		</a>-->
	</aside>

	<div style="position: relative;">
		<button class="nav-btn prev-btn" onclick="goToDate(-1)">❮</button>
		<button class="nav-btn next-btn" onclick="goToDate(1)">❯</button>

		<div class="date-input" id="dateInput" onclick="showCalender()">Select
			Date</div>

		<div class="calendar" id="calendar">
			<div class="calendar-header">
				<button onclick="changeMonth(-1)">‹</button>
				<span id="monthYear"></span>
				<button onclick="changeMonth(1)">›</button>
			</div>
			<div class="calendar-grid" id="calendarGrid"></div>
		</div>

		<div class="diary">

			<div id="turning-page">
				<div class="page-face front"></div>
				<div class="page-face back"></div>
			</div>

			<form id="diaryForm">

				<!-- LEFT PAGE -->
				<div class="left page">
					<h2>Memory Lane</h2>

					<div class="memories-container">

						<label for="file-upload" class="custom-file-upload"> <i
							class="fa-solid fa-plus"></i>
						</label> <input id="file-upload" type="file" name="photos"
							accept="image/*" multiple onchange="previewimage(event)">

						<div id="preview"></div>
					</div>

					<!--    <button onclick="clearImage()" type="button" class="trash-btn">
                    <i class="fa-solid fa-trash"></i>
                </button>-->
				</div>

				<!-- RIGHT PAGE -->
				<div class="diary-container page">
					<h2>Moments Unfold</h2>

					<label>Date</label>

					<div style="position: relative; width: 160px;">

						<span id="rightDateDisplay"
							style="display: block; padding: 6px; border-bottom: 1px dashed #999;">
							📅 -- </span> <input type="date" id="date" onchange="getDate()"
							style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; opacity: 0; cursor: pointer;">

					</div>

					<label>Title</label> <input type="text" id="title" name="title"
						required> <label>Entry</label>
					<textarea id="content" name="content" required></textarea>

					<div style="text-align: right;">
						<button type="submit" class="seal-btn">SAVE</button>
					</div>

					<p id="message"></p>
				</div>

			</form>
		</div>
	</div>

	<script src="diary1.js"></script>
</body>
</html>
