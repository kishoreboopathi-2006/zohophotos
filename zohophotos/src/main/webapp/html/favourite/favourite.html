<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Favourite | ZOHO Photos</title>
<script src="https://unpkg.com/@phosphor-icons/web"></script>
<link rel="stylesheet" href="favourite.css">
<script src="favourite.js" defer></script>
</head>

<body>

	<div class="app-layout">

		<!-- ===== SIDEBAR ===== -->
		<aside class="sidebar">
			<div class="sidebar-logo">
				<div class="Gemini_Generated_Image_ogk0tdogk0tdogk0-removebg-preview.png"></div>
				<h1>Momento</h1>
			</div>

			<nav>
				<div class="menu-item" onclick="dashboardPage()">
					<i class="ph ph-squares-four"></i> <span>Dashboard</span>
				</div>

				<div class="menu-item" onclick="albumPage()">
					<i class="ph ph-folder-notch"></i> <span>Albums</span>
				</div>

				<div class="menu-item active" onclick="favouritePage()"
					style="background: #eff6ff; color: var(--primary);">
					<i class="ph ph-heart"></i> <span>Favorites</span>
				</div>

				<div class="menu-item" onclick="diaryPage()">
					<i class="ph ph-notebook"></i> <span>Diary</span>
				</div>
				
				<div class="menu-item" onclick="showVideos()">
				<i class="ph ph-video-camera"></i><span>Videos</span>
			</div>
			<!-- 	<div class="menu-item" onclick="reminderPage()">
					<i class="ph ph-hourglass-medium"></i> <span>Reminder</span>
				</div>-->

				<div class="menu-item" onclick="trashPage()" style="margin-top:700px;">
					<i class="ph ph-trash"></i> <span>Trash</span>
				</div>
			</nav>

			<!--  <a href="/zohophotos/html/loginpage/signin.html" class="menu-item"
				style="margin: 15px; color: var(--danger); text-decoration: none;">
				<i class="ph ph-sign-out"></i> <span>Sign Out</span>
			</a>-->
		</aside>

		<!-- ===== MAIN CONTENT ===== -->
		<main class="main-content">

			<header class="top-bar">
				<h2 class="section-title">Favourite Photos</h2>

				<div class="user-profile">
					<div class="user-info">
						<span class="user-name">Kaviya</span> <span class="user-role">User</span>
					</div>
					<div class="avatar">K</div>
				</div>
			</header>

			<div class="content-scroll">
				<div id="galleryGrid" class="gallery-grid">
				</div>

		</main>

	</div>
</body>
</html>
