<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MagicReminder - Professional Edition</title>
<link
	href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
	rel="stylesheet">
<link rel="stylesheet" href="reminder.css">
<script src="https://unpkg.com/@phosphor-icons/web"></script>

</head>
<body>
	<nav>
		<div class="logo">
			<div class="logo-box">
				<svg width="22" height="22" viewBox="0 0 24 24" fill="none"
					stroke="currentColor" stroke-width="3">
					<path
						d="m12 3-1.912 5.813a2 2 0 0 1-1.275 1.275L3 12l5.813 1.912a2 2 0 0 1 1.275 1.275L12 21l1.912-5.813a2 2 0 0 1 1.275-1.275L21 12l-5.813-1.912a2 2 0 0 1-1.275-1.275L12 3Z" /></svg>
			</div>
			<h1>Reminder</h1>
		</div>
		<div class="nav-actions">
			<button class="btn-round" id="theme-toggle">
				<svg width="18" height="18" viewBox="0 0 24 24" fill="none"
					stroke="currentColor" stroke-width="2.5">
					<path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>
			</button>
		</div>
	</nav>

	<div class="app-container">
		<aside>
			<div class="cal-header">
				<h2 id="cal-month-label"></h2>
				<div class="cal-nav">
					<button class="btn-round sm" id="prev-month">←</button>
					<button class="btn-round sm" id="next-month">→</button>
				</div>
			</div>
			<div class="cal-day-labels">
				<div>S</div>
				<div>M</div>
				<div>T</div>
				<div>W</div>
				<div>T</div>
				<div>F</div>
				<div>S</div>
			</div>
			<div id="calendar-grid" class="cal-grid"></div>
		</aside>

		<main class="main-content">
			<div class="cat-row">
				<div data-type="birthday" class="cat-box active"
					style="--accent: #ec4899;">
					<div class="cat-icon">
						<svg width="24" height="24" viewBox="0 0 24 24" fill="none"
							stroke="currentColor" stroke-width="2">
							<path d="M20 12V22H4V12" />
							<rect width="20" height="5" x="2" y="7" />
							<path d="M12 22V7" />
							<path d="M12 7H7.5a2.5 2.5 0 0 1 0-5C11 2 12 7 12 7z" />
							<path d="M12 7h4.5a2.5 2.5 0 0 0 0-5C13 2 12 7 12 7z" /></svg>
					</div>
					<h3>Birthday</h3>
					<p id="count-birthday">0 Moments</p>
				</div>
				<div data-type="wedding" class="cat-box" style="--accent: #8b5cf6;">
					<div class="cat-icon">
						<svg width="24" height="24" viewBox="0 0 24 24" fill="none"
							stroke="currentColor" stroke-width="2">
							<path
								d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z" /></svg>
					</div>
					<h3>Wedding</h3>
					<p id="count-wedding">0 Moments</p>
				</div>
				<div data-type="work" class="cat-box" style="--accent: #3b82f6;">
					<div class="cat-icon">
						<svg width="24" height="24" viewBox="0 0 24 24" fill="none"
							stroke="currentColor" stroke-width="2">
							<rect width="20" height="14" x="2" y="7" rx="2" ry="2" />
							<path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16" /></svg>
					</div>
					<h3>Work</h3>
					<p id="count-work">0 Moments</p>
				</div>
				<div data-type="other" class="cat-box" style="--accent: #f59e0b;">
					<div class="cat-icon">
						<svg width="24" height="24" viewBox="0 0 24 24" fill="none"
							stroke="currentColor" stroke-width="2">
							<circle cx="12" cy="12" r="1" />
							<circle cx="19" cy="12" r="1" />
							<circle cx="5" cy="12" r="1" /></svg>
					</div>
					<h3>Other</h3>
					<p id="count-other">0 Moments</p>
				</div>
			</div>

			<div class="list-header">
				<h2 id="list-title">Upcoming Birthdays</h2>
				<button class="btn-main" id="open-modal">+ New Moment</button>
			</div>

			<div id="events-grid" class="container"></div>
		</main>
	</div>

	<div id="add-modal" class="modal-wrap">
		<div class="modal-box">
			<h2>New Moment</h2>
			<form id="save-form">
				<div class="upload-area" id="drop-zone">
					<input type="file" name="photo" id="f-input" hidden
						accept="image/*">
					<div id="u-placeholder">📸 SELECT PHOTO</div>
					<img id="u-preview" style="display: none">
				</div>
				<input required type="text" name="title" placeholder="Event Name">
				<input required type="date" name="date"> <input
					type="hidden" name="type" id="f-type" value="birthday">
				<div class="type-grid">
					<div data-val="birthday" class="type-item active">Birthday</div>
					<div data-val="wedding" class="type-item">Wedding</div>
					<div data-val="work" class="type-item">Work</div>
					<div data-val="other" class="type-item">Other</div>
				</div>
				<textarea name="message" rows="3" placeholder="Additional Notes..."></textarea>
				<div style="display: flex; gap: 10px">
					<button type="button" class="btn-main secondary" id="close-modal">Cancel</button>
					<button type="submit" class="btn-main">Save Memory</button>
				</div>
			</form>
		</div>
	</div>

	<script src="reminder.js"></script>
</body>
</html>
