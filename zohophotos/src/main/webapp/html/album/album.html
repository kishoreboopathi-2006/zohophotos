<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Album | ZOHO Photos</title>

<link rel="stylesheet" href="album.css">
<script src="album.js" defer></script>
<link
	href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
	rel="stylesheet">
<link href="dashboard.css" rel="stylesheet">
<link rel="stylesheet"
	href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css">
<script src="https://unpkg.com/@phosphor-icons/web"></script>
<link rel="stylesheet"
	href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css">
<script src="https://unpkg.com/@phosphor-icons/web"></script>

<script src="https://cdn.dashjs.org/latest/dash.all.min.js"></script>

<link href="card.css" rel="stylesheet">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Alfa+Slab+One&family=Asset&family=Betania+Patmos+In+GDL&family=Bungee+Shade&family=Changa+One:ital@0;1&family=Chango&family=Cinzel:wght@400..900&family=Creepster&family=Erica+One&family=Fascinate&family=Gravitas+One&family=Honk:MORF@15&family=Jost:ital,wght@0,100..900;1,100..900&family=Limelight&family=Luckiest+Guy&family=Nosifer&family=Notable&family=Oi&family=Rubik+Doodle+Shadow&family=Rubik+Spray+Paint&family=Ruslan+Display&family=Schibsted+Grotesk:ital,wght@0,400..900;1,400..900&family=Trade+Winds&display=swap" rel="stylesheet">
</head>

<body>

	<!-- ===== SIDEBAR ===== -->
	<aside class="sidebar">
		<div class="sidebar-logo">
			
			<img
					src="momento1.png"
					class="logo">
				<h1>Momento</h1>
			
		</div>
		<div class="user-profile">
    <i class="ph ph-user-circle"></i>
</div>

		<nav>
			<div class="menu-item" onclick="dashboardPage()">
				<i class="ph ph-squares-four"></i> <span>Dashboard</span>
			</div>

			<div class="menu-item  active" onclick="albumPage()">
				<i class="ph ph-folder-notch"></i> <span>Albums</span>
			</div>

			<div class="menu-item" onclick="favouritePage()">
				<i class="ph ph-heart"></i> <span>Favorites</span>
			</div>

			<div class="menu-item" onclick="diaryPage()">
				<i class="ph ph-notebook"></i> <span>Diary</span>
			</div>

			<!--  <div class="menu-item" onclick="reminderPage()">
				<i class="ph ph-hourglass-medium"></i> <span>Reminder</span>
			</div>-->

			
		</nav>
		<div class="menu-item bottom" onclick="trashPage()" style="margin-top:682px;">
				<i class="ph ph-trash"></i> <span>Trash</span>
			</div>

		<!--  <a href="/zohophotos/html/loginpage/signin.html" class="menu-item"
			style="margin: 15px; color: var(--danger); text-decoration: none;">
			<i class="ph ph-sign-out"></i> <span>Sign Out</span>
		</a>-->
	</aside>

	<!-- ===== MAIN CONTENT ===== -->
	<main class="main-content">
		<h2 class="section-title" style="font-weight:400;">Album</h2>
		<div id="galleryGrid" class="gallery-grid"></div>
	</main>

	<!-- PHOTO OVERLAY -->
	<div id="photos-overlay"></div>
		<div id="viewBox"></div>
	  <div id="loader" class="loader-overlay hidden">
        <div class="momento-word">
            <span style="--i:1">M</span>
            <span style="--i:2">o</span>
            <span style="--i:3">m</span>
            <span style="--i:4">e</span>
            <span style="--i:5">n</span>
            <span style="--i:6">t</span>
            <span style="--i:7">o</span>
        </div>
    </div>
	

</body>
</html>
