<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Favourite | ZOHO Photos</title>
<script src="https://unpkg.com/@phosphor-icons/web"></script>
<link rel="stylesheet" href="trash.css">

<link rel="stylesheet"
	href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css">
<script src="trash.js" defer></script>
</head>

<body>

	<div class="app-layout">

		<!-- ===== SIDEBAR ===== -->
		<aside class="sidebar">
			<div class="sidebar-logo">
				<img
					src="momento1.png"
					class="logo">
				
			</div>

			<nav>
				<div class="menu-item" onclick="dashboardPage()">
					<i class="ph ph-squares-four"></i> <span>Dashboard</span>
				</div>

				<div class="menu-item" onclick="albumPage()">
					<i class="ph ph-folder-notch"></i> <span>Albums</span>
				</div>

				<div class="menu-item" onclick="favouritePage()">
					<i class="ph ph-heart"></i> <span>Favorites</span>
				</div>

				<div class="menu-item" onclick="diaryPage()">
					<i class="ph ph-notebook"></i> <span>Diary</span>
				</div>
				<!--  <div class="menu-item active" onclick="showVideos()">
				<i class="ph ph-video-camera"></i><span>Videos</span>
			</div>-->
				<!--  <div class="menu-item" onclick="reminderPage()">
					<i class="ph ph-hourglass-medium"></i> <span>Reminder</span>
				</div>-->

				<div class="menu-item active" onclick="deleteImage()"
					style="background: #fee2e2; color: var(--danger); margin-top:633px;">
					<i class="ph ph-trash"></i> <span>Trash</span>
				</div>
			</nav>

			<div class="sidebar-footer">
				<!--  <a href="/zohophotos/html/loginpage/signin.html" class="menu-item"
					style="color: var(--danger); text-decoration: none; margin-bottom: 0;">
					<i class="ph ph-sign-out"></i> <span>Sign Out</span>
				</a>-->
			</div>
		</aside>

		<!-- ===== MAIN CONTENT ===== -->
		<main class="main-content">

			<header class="top-bar">
				<h2 class="section-title">Trash</h2>

				<div class="user-profile">
					<div class="user-info">
						<span class="user-name">Kaviya</span> <span class="user-role">User</span>
					</div>
					<div class="avatar">K</div>
				</div>
			</header>

			<div class="content-scroll">
				<div id="galleryGrid" class="gallery-grid">
					<!-- Photo Cards with Trash Button -->
					<div class="photo-card">
						<img src="https://picsum.photos/seed/t1/400/300" alt="Deleted 1">
						<div class="trash-overlay">
							<i class="ph ph-trash"></i>
						</div>
					</div>
					<div class="photo-card">
						<img src="https://picsum.photos/seed/t2/400/300" alt="Deleted 2">
						<div class="trash-overlay">
							<i class="ph ph-trash"></i>
						</div>
					</div>
					<div class="photo-card">
						<img src="https://picsum.photos/seed/t3/400/300" alt="Deleted 3">
						<div class="trash-overlay">
							<i class="ph ph-trash"></i>
						</div>
					</div>
					<div class="photo-card">
						<img src="https://picsum.photos/seed/t4/400/300" alt="Deleted 4">
						<div class="trash-overlay">
							<i class="ph ph-trash"></i>
						</div>
					</div>
					<div class="photo-card">
						<img src="https://picsum.photos/seed/t5/400/300" alt="Deleted 5">
						<div class="trash-overlay">
							<i class="ph ph-trash"></i>
						</div>
					</div>
					<div class="photo-card">
						<img src="https://picsum.photos/seed/t6/400/300" alt="Deleted 6">
						<div class="trash-overlay">
							<i class="ph ph-trash"></i>
						</div>
					</div>
				</div>
			</div>
  <div id="loader" class="loader-overlay hidden">
        <div class="momento-word">
            <span style="--i:1">M</span>
            <span style="--i:2">o</span>
            <span style="--i:3">m</span>
            <span style="--i:4">e</span>
            <span style="--i:5">n</span>
            <span style="--i:6">t</span>
            <span style="--i:7">o</span>
        </div>
    </div>

		</main>

	</div>


</body>
</html>
